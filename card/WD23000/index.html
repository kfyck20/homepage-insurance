  if((node.style.textDecoration||'').includes('underline'))style.push('text-decoration:underline');
  return '<'+out+(style.length?' style="'+style.join(';')+'"':'')+'>'+inner+'</'+out+'>';
 }
 return Array.from(tpl.content.childNodes,clean).join('');
}
function linkedStory(markup){
 const root=document.createElement('div');root.innerHTML=cleanStory(markup);
 let run=[];
 function finish(){
  if(!run.length)return;
  const text=run.map(n=>n.data).join('');
  const pattern=/(?:https?:\/\/|www\.)[^\s<>"'“”‘’]+|(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+(?:kr|com|org|net|edu|gov|co|io|ai|app|dev|me|info)(?=$|[^a-z0-9-])(?:[/?#][^\s<>"'“”‘’]*)?/gi;
  const hits=[];let match;
  while((match=pattern.exec(text))){
   if(match.index && /[a-z0-9@._-]/i.test(text[match.index-1]))continue;
   let label=match[0].replace(/[.,!?;:…。，、！？]+$/,'');
   for(const [open,close] of [['(',')'],['[',']'],['{','}']]){
    while(label.endsWith(close)&&label.split(close).length>label.split(open).length)label=label.slice(0,-1);
   }
   const href=web(/^https?:\/\//i.test(label)?label:'https://'+label);
   if(href)hits.push({start:match.index,end:match.index+label.length,href});
  }
  if(hits.length){
   let offset=0,first=0;
   for(const node of run){
    const end=offset+node.data.length;
    while(first<hits.length&&hits[first].end<=offset)first++;
    let pos=0;
    const frag=document.createDocumentFragment();
    for(let j=first;j<hits.length&&hits[j].start<end;j++){
     const h=hits[j],l=Math.max(0,h.start-offset),r=Math.min(node.data.length,h.end-offset);
     if(l>=r)continue;
     frag.append(node.data.slice(pos,l));
     const a=document.createElement('a');a.href=h.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent=node.data.slice(l,r);frag.append(a);pos=r;
    }
    if(pos){frag.append(node.data.slice(pos));node.parentNode.replaceChild(frag,node)}
    offset=end;
   }
  }
  run=[];
 }
 function visit(node){
  if(node.nodeType===3){run.push(node);return}
  const boundary=['BR','DIV','P','A'].includes(node.nodeName);if(boundary)finish();
  if(node.nodeName!=='A')Array.from(node.childNodes).forEach(visit);
  if(boundary)finish();
 }
 visit(root);return root.innerHTML;
}
function blocksFor(post){
 const blocks=Array.isArray(post.blocks)?post.blocks:[{kind:'text',markup:html(post.text||'').replace(/\n/g,'<br>')}];
 if(!post.url)return blocks;
 const href=web(post.url),label=html(post.url);
 return [...blocks,{kind:'text',markup:href?'<a href="'+html(href)+'">'+label+'</a>':label}];
}
function blockBody(block){
 if(block.kind==='text')return '<div class="storyText">'+linkedStory(block.markup)+'</div>';
 if(block.kind==='image'&&/^data:image\/(jpeg|png|webp);base64,/i.test(block.src))return '<figure class="storyImage"><img src="'+html(block.src)+'" alt="'+html(block.caption||block.name||'첨부 사진')+'">'+(block.caption?'<figcaption>'+html(block.caption)+'</figcaption>':'')+'</figure>';
 if(block.kind==='file'&&/^data:application\/octet-stream;base64,/i.test(block.src))return '<a class="storyFile" href="'+html(block.src)+'" download="'+html(block.name)+'"><i>'+pict('file')+'</i><span><b>'+html(block.name)+'</b><small>'+Math.ceil((block.bytes||0)/1024)+' KB</small></span>'+pict('save')+'</a>';
 return '';
}
function storyArticle(p){
 const date=p.createdAt?'<time datetime="'+html(p.createdAt)+'">'+html(p.createdAt.slice(0,10).replace(/-/g,'. '))+'</time>':'';
 return '<article class="boardPost richArticle">'+date+'<h3>'+html(p.title)+'</h3>'+blocksFor(p).map(blockBody).join('')+'</article>';
}
function boardIndex(body,posts,mode){
 if(!posts.length){body.textContent='아직 등록된 게시글이 없어요.';return}
 const button=(p,i,cover)=>{
  const pic=blocksFor(p).find(b=>b.kind==='image'&&/^data:image\/(?:png|jpeg|webp);base64,/i.test(b.src));
  const tile=cover?(pic?'<img class="albumPic" alt="" src="'+html(pic.src)+'">':'<span class="albumBlank" aria-hidden="true">'+pict('news')+'</span>'):'';
  return '<button type="button" class="openStory" data-story="'+i+'">'+tile+(cover?'<small>No. '+html(String(p.number))+'</small>':'')+'<strong>'+html(p.title)+'</strong></button>';
 };
 const table=mode==='table';
 const show=()=>{
  body.innerHTML=table?'<table class="readerTable"><thead><tr><th>번호</th><th>제목</th><th>작성일</th></tr></thead><tbody>'+posts.map((p,i)=>'<tr><td>'+html(String(p.number))+'</td><td>'+button(p,i,false)+'</td><td>'+html((p.createdAt||'').slice(0,10)||'—')+'</td></tr>').join('')+'</tbody></table>':'<div class="readerAlbum">'+posts.map((p,i)=>button(p,i,true)).join('')+'</div>';
  body.querySelectorAll('[data-story]').forEach(el=>{const i=Number(el.dataset.story);el.onclick=()=>{
   body.innerHTML='<button type="button" class="indexBack">‹ 목록</button>'+storyArticle(posts[i]);body.closest('dialog').scrollTop=0;
   const back=body.querySelector('button');back.focus();back.onclick=()=>{show();body.querySelector('[data-story="'+i+'"]').focus()};
  }});
 };
 show();
}
(async()=>{
 const root=document.getElementById('card');
 const id=location.pathname.match(/^\/card\/(WD23000|WD26002)\/(?:index\.html)?$/)?.[1];
 try{
  if(!id)throw Error();
  const cfg=AGENTS[id],res=await fetch(cfg.url+'/rest/v1/wd_mobile_cards?select=published&agent_id=eq.'+id,{headers:{apikey:cfg.key},credentials:'omit',cache:'no-store'});
  if(!res.ok)throw Error();const rows=await res.json();const card=rows[0]?.published;if(!card?.name){root.textContent='아직 공개된 명함이 없어요.';return}
  document.title=card.name+' 모바일 명함';root.innerHTML=renderCard(card);

  const openBoard=()=>{if(location.hash==='#board'&&!document.querySelector('.boardDrawer[open]'))root.querySelector('[data-board]')?.click()};openBoard();window.addEventListener('hashchange',openBoard);
 }catch{root.textContent='현재 이 명함을 열 수 없어요. 잠시 후 다시 확인해 주세요.'}
})();
